# learn2（2026-11-22，三臂后续消融）：frontier × 批学习间隔 2
# 学习占墙钟 32%，每 2 个 option 学一步（缓冲照常累积）省一半学习开销。
# 判据：held-out 成功率不降 → 采纳（learn_every 超参消融，CHANGELOG 预登记项）。
arm: A
stage0_options: 40000
stage1_options: 120000
stage1_eps_restart: 0.05
stage1_lr: null

env_randomize: true
env_max_steps: 1000
lidar_n_beams: 180
lidar_max_range: 2.0
swanlab: true
swanlab_project: BAMER-RL
swanlab_mode: cloud
eval_every_options: 10000
eval_mini_seeds: 3
maze_n: 16
maze_braiding_stage0: 0.0
maze_loops_stage0: [0, 30]
maze_braiding_stage1: 0.8
maze_loops_stage1: [25, 50]
frontier_mask: true            # Explore 目标收窄为信念前沿格

gamma: 0.999
lr: 1.0e-4
batch_size: 64
target_sync_options: 1000
warmup_options: 2000
learn_every: 2                 # 每 2 个 option 学习一步（默认 1）
lambda_aux: 0.5
grad_clip: 10.0
eps_start: 0.10
eps_end: 0.02
eps_anneal_options: 20000
capacity: 100000
aux_head: true
use_traj: true
use_gru: false

shape_potential: true
shape_scale: 2000.0
cuda_graph: true

seed: 0
out_dir: algo/runs/armA_frontier_learn2
checkpoint_every_options: 10000
smoke: false
