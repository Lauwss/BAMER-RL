# 送达奖励尺度消融臂①（2026-11-22，用户拍板）：送达 300→600，其余同 rf 参考臂。
# 对照 armA_frontier_dist_dilate（58.0% @1000 / 68.0% @1500，deliver-fail 6% @1000）。
# 假设链：加大派送激励 → 派送期"继续探索 vs 立即派送"边际权衡右移 → deliver-fail↓。
# 风险（预注册哨兵）：搜索期提前派送绕路打断扫掠连续性 → 总步数/超时反升。
# 预注册判据：deliver-fail↓ 且 总步数/超时不升；两者皆负 = "余额转移"非改善。
arm: A
stage0_options: 40000
stage1_options: 120000
stage1_eps_restart: 0.05
stage1_lr: null

env_randomize: true
env_max_steps: 1000
lidar_n_beams: 180
lidar_max_range: 2.0
swanlab: true
swanlab_project: BAMER-RL
swanlab_mode: cloud
eval_every_options: 10000
eval_mini_seeds: 3
maze_n: 16
maze_braiding_stage0: 0.0
maze_loops_stage0: [0, 30]
maze_braiding_stage1: 0.8
maze_loops_stage1: [25, 50]
frontier_mask: true

dist_channel: true
dilated_backbone: true

reward_delivery: 600.0          # ← 消融主变量：送达 +300→+600/台

gamma: 0.999
lr: 1.0e-4
batch_size: 64
target_sync_options: 1000
warmup_options: 2000
lambda_aux: 0.5
grad_clip: 10.0
eps_start: 0.10
eps_end: 0.02
eps_anneal_options: 20000
capacity: 100000
aux_head: true
use_traj: true
use_gru: false

shape_potential: true
shape_scale: 2000.0
cuda_graph: true

seed: 0
out_dir: algo/runs/armA_frontier_dist_dilate_dlv600
checkpoint_every_options: 10000
smoke: false
