# 方向连续性特征消融·主臂（2026-11-22）：dist+dilate 栈 + CH_ALIGN 对齐度场
# 对照 armA_frontier_dist_dilate（同栈无 dir，100-seed held-out 58.0%、搜索超时
# 36%、repeat 解剖 behind τ̄ 12.9/repeat̄ 5.86）。主变量 dir_channel=true：
# "候选是否在来路方向"成对量写在候选格自身位置 RF-1 可读——repeat 解剖定论
# 主导来自 behind 代价不对称（τ̄ ×1.8、每选择 repeat 产量 ×2.6、49% 选择占
# 70% 质量）+ 自锁 P(B|B)=0.63，且 veto-behind 证伪配额思路——通道预期让裁决
# 知情（behind 隐藏代价可见），收益形式 = behind 单位信息代价↓ 而非份额↓。
# 预注册判据：100-seed held-out 成功率 vs 58%（Fisher）；机制判据 =
# repeat_anatomy 复测 behind τ̄/repeat̄ 降、覆盖持平 + explore_probe
# ρ(对齐度,优势) 从预检 +0.05 转负向可用（训练进通道后复核）。
arm: A
stage0_options: 40000
stage1_options: 120000
stage1_eps_restart: 0.05
stage1_lr: null

env_randomize: true
env_max_steps: 1000
lidar_n_beams: 180
lidar_max_range: 2.0
swanlab: true
swanlab_project: BAMER-RL
swanlab_mode: cloud
eval_every_options: 10000
eval_mini_seeds: 3
maze_n: 16
maze_braiding_stage0: 0.0
maze_loops_stage0: [0, 30]
maze_braiding_stage1: 0.8
maze_loops_stage1: [25, 50]
frontier_mask: true            # 与参考臂同栈：frontier 引导保持开启

dist_channel: true             # 与参考臂同栈：距离通道
dilated_backbone: true         # 与参考臂同栈：膨胀主干
dir_channel: true              # ← 消融主变量：方向对齐度场（CH_ALIGN）

gamma: 0.999
lr: 1.0e-4
batch_size: 64
target_sync_options: 1000
warmup_options: 2000
lambda_aux: 0.5
grad_clip: 10.0
eps_start: 0.10
eps_end: 0.02
eps_anneal_options: 20000
capacity: 100000
aux_head: true
use_traj: true
use_gru: false

shape_potential: true
shape_scale: 2000.0
cuda_graph: true

seed: 0
out_dir: algo/runs/armA_frontier_dist_dilate_dir
checkpoint_every_options: 10000
smoke: false
