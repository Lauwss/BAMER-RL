# fixppt_f_s0（2026-11-22，三臂后续消融）：固定官方 PPT 赛图 × frontier_mask，seed 0
# 官方图 + frontier 引导——比赛对标配置，从未跑过（对照 = 固定图无 frontier）。
# 判据：held-out 成功率 + POI 定位率（与 armA_g0999_aux05_fixppt 对照）。
arm: A
stage0_options: 40000
stage1_options: 120000
stage1_eps_restart: 0.05
stage1_lr: null

env_randomize: true           # 固定迷宫下仅机器布点每集随机
env_max_steps: 1000
lidar_n_beams: 180
lidar_max_range: 2.0
swanlab: true
swanlab_project: BAMER-RL
swanlab_mode: cloud
eval_every_options: 10000
eval_mini_seeds: 3
maze_n: 16
maze_braiding_stage0: 0.0     # 固定官方图时不生效
maze_loops_stage0: [0, 30]
maze_braiding_stage1: 0.8     # 固定官方图时不生效
maze_loops_stage1: [25, 50]
maze_fixed: official          # 固定官方赛图
frontier_mask: true           # Explore 目标收窄为信念前沿格

gamma: 0.999
lr: 1.0e-4
batch_size: 64
target_sync_options: 1000
warmup_options: 2000
lambda_aux: 0.5
grad_clip: 10.0
eps_start: 0.10
eps_end: 0.02
eps_anneal_options: 20000
capacity: 100000
aux_head: true
use_traj: true
use_gru: false

shape_potential: true
shape_scale: 2000.0
cuda_graph: true

seed: 0
out_dir: algo/runs/armA_fixppt_frontier_s0
checkpoint_every_options: 10000
smoke: false
