# 臂 C：基线（原型）——无阶段 0，从头直接训全任务（服务器正式训练配置）
arm: C
stage0_options: 0
stage1_options: 160000      # 基线臂给足预算（无预训练加成）
stage1_eps_restart: 0.05
stage1_lr: null

env_randomize: true
env_max_steps: 1000
lidar_n_beams: 180
lidar_max_range: 2.0
maze_n: 16

gamma: 0.99
lr: 1.0e-4
batch_size: 64
target_sync_options: 1000
warmup_options: 2000
lambda_aux: 0.5
grad_clip: 10.0
eps_start: 0.10
eps_end: 0.02
eps_anneal_options: 20000
capacity: 100000
aux_head: true
use_traj: true
use_gru: false

seed: 0
out_dir: algo/runs/armC_baseline
checkpoint_every_options: 10000
smoke: false
