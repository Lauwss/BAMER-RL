# 感受野修复 × 固定图（2026-11-22 用户提议）：fixgen 同任务 + 距离通道/膨胀组合栈
# 对照 armA_g0999_aux05_fixgen_frontier（旧栈 fixgen，30-seed held-out 73.3%、
# 搜索超时 23%、背图红利快例 127-235 步/探索仅 19-40%）。回答两个问题：
# ① 组合栈在固定图上是否同样提升（背图红利之上还有多少）；
# ② 背图签名是否变化——若快例更多/步数更短 = 距离场记忆化助背图；若快例
#    消失/探索覆盖升 = 组合栈收益来自真探索而非背图。
arm: A
stage0_options: 40000
stage1_options: 120000
stage1_eps_restart: 0.05
stage1_lr: null

env_randomize: true
env_max_steps: 1000
lidar_n_beams: 180
lidar_max_range: 2.0
swanlab: true
swanlab_project: BAMER-RL
swanlab_mode: cloud
eval_every_options: 10000
eval_mini_seeds: 3
maze_n: 16
maze_braiding_stage0: 0.0
maze_loops_stage0: [0, 30]
maze_braiding_stage1: 0.8
maze_loops_stage1: [25, 50]
maze_fixed: generated         # ← 与 fixgen_frontier 同一张固定迷宫（seed+200 派生）
frontier_mask: true           # 与两个对照同栈：frontier 引导保持开启

dist_channel: true            # ← 组合栈主变量①
dilated_backbone: true        # ← 组合栈主变量②

gamma: 0.999
lr: 1.0e-4
batch_size: 64
target_sync_options: 1000
warmup_options: 2000
lambda_aux: 0.5
grad_clip: 10.0
eps_start: 0.10
eps_end: 0.02
eps_anneal_options: 20000
capacity: 100000
aux_head: true
use_traj: true
use_gru: false

shape_potential: true
shape_scale: 2000.0
cuda_graph: true

seed: 0
out_dir: algo/runs/armA_fixgen_frontier_dist_dilate
checkpoint_every_options: 10000
smoke: false
