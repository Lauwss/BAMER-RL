# lidar60（2026-11-22，三臂后续消融）：frontier × 雷达降束 60（激进档）
# 观测分辨率降至 1/3 的代价（投射占墙钟 33.7%，激进档省得更多）。
# 判据：held-out 成功率降幅 ≤3-5pp → 采纳；与 lidar90 对比取更省的合格档。
arm: A
stage0_options: 40000
stage1_options: 120000
stage1_eps_restart: 0.05
stage1_lr: null

env_randomize: true
env_max_steps: 1000
lidar_n_beams: 60              # D4 默认 180 → 降至 1/3
lidar_max_range: 2.0
swanlab: true
swanlab_project: BAMER-RL
swanlab_mode: cloud
eval_every_options: 10000
eval_mini_seeds: 3
maze_n: 16
maze_braiding_stage0: 0.0
maze_loops_stage0: [0, 30]
maze_braiding_stage1: 0.8
maze_loops_stage1: [25, 50]
frontier_mask: true            # Explore 目标收窄为信念前沿格

gamma: 0.999
lr: 1.0e-4
batch_size: 64
target_sync_options: 1000
warmup_options: 2000
lambda_aux: 0.5
grad_clip: 10.0
eps_start: 0.10
eps_end: 0.02
eps_anneal_options: 20000
capacity: 100000
aux_head: true
use_traj: true
use_gru: false

shape_potential: true
shape_scale: 2000.0
cuda_graph: true

seed: 0
out_dir: algo/runs/armA_frontier_lidar60
checkpoint_every_options: 10000
smoke: false
