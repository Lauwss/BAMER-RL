# 送达奖励尺度消融·600 臂（2026-11-22，用户拍板 600/1000 双臂）：dist+dilate 栈
# 对照 armA_frontier_dist_dilate（同栈 reward_delivery=300，100-seed held-out
# 58.0%、搜索超时 36%、找到未送达 6%、覆盖 67.0%）。
# 假设检验："派送激励"假设——送达 +300→+600 是否改善 deliver-fail / 总步数。
# 预注册判据（防事后解释）：deliver-fail↓ 且 总步数/超时不升（哨兵 = 提前派送
# 绕路打断扫掠连续性的反噬，ceiling 诊断链）；机制判据 = 首次 Pick 时机前移。
# 注意：这是 D8 奖励语义变更（改最优策略，非 PBRS 类不动点操作），转正须拍板。
arm: A
stage0_options: 40000
stage1_options: 120000
stage1_eps_restart: 0.05
stage1_lr: null

env_randomize: true
env_max_steps: 1000
lidar_n_beams: 180
lidar_max_range: 2.0
swanlab: true
swanlab_project: BAMER-RL
swanlab_mode: cloud
eval_every_options: 10000
eval_mini_seeds: 3
maze_n: 16
maze_braiding_stage0: 0.0
maze_loops_stage0: [0, 30]
maze_braiding_stage1: 0.8
maze_loops_stage1: [25, 50]
frontier_mask: true

dist_channel: true
dilated_backbone: true
reward_delivery: 600.0         # ← 消融主变量：送达 +300→+600/台

gamma: 0.999
lr: 1.0e-4
batch_size: 64
target_sync_options: 1000
warmup_options: 2000
lambda_aux: 0.5
grad_clip: 10.0
eps_start: 0.10
eps_end: 0.02
eps_anneal_options: 20000
capacity: 100000
aux_head: true
use_traj: true
use_gru: false

shape_potential: true
shape_scale: 2000.0
cuda_graph: true

seed: 0
out_dir: algo/runs/armA_frontier_dist_dilate_deliver600
checkpoint_every_options: 10000
smoke: false
