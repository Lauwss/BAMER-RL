# 臂 B：熵预训练 → 全任务微调（服务器正式训练配置）
# 阶段 0：−1/步 + 信息增益（未知墙位数精确计数），终止 = 步数预算
arm: B
stage0_options: 40000
stage1_options: 120000
stage1_eps_restart: 0.05
stage1_lr: null

env_randomize: true
env_max_steps: 1000
lidar_n_beams: 180
lidar_max_range: 2.0
swanlab: false               # SwanLab 实验管理（云端；正式训练改 true，先 swanlab login）
swanlab_project: BAMER-RL
swanlab_mode: cloud
eval_every_options: 10000    # 训练中 mini held-out 评估（每 N options，3 seeds greedy）
eval_mini_seeds: 3
maze_n: 16
maze_braiding_stage0: 0.0    # stage0 低环：练死胡同回溯 + 系统覆盖
maze_loops_stage0: [0, 30]
maze_braiding_stage1: 0.8    # stage1 匹配 braided 赛图（37 环/215 格）
maze_loops_stage1: [25, 50]

gamma: 0.99
lr: 1.0e-4
batch_size: 64
target_sync_options: 1000
warmup_options: 2000
lambda_aux: 0.5
grad_clip: 10.0
eps_start: 0.10
eps_end: 0.02
eps_anneal_options: 20000
capacity: 100000
aux_head: true
use_traj: true
use_gru: false

seed: 0
out_dir: algo/runs/armB_entropy_pretrain
checkpoint_every_options: 10000
smoke: false
