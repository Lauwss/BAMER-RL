# frontier 引导实验（2026-11-21，探索塌缩修复§改动1）：温室验证版
# 在 fixgen 固定生成图上开启 frontier_mask——对照 armA_g0999_aux05_fixgen
# （0 送达、greedy 15 格死循环、30-seed 0/30）。回答：frontier 收窄能否
# 消除固定迷宫贪心塌缩。
arm: A
stage0_options: 40000
stage1_options: 120000
stage1_eps_restart: 0.05
stage1_lr: null

env_randomize: true
env_max_steps: 1000
lidar_n_beams: 180
lidar_max_range: 2.0
swanlab: true
swanlab_project: BAMER-RL
swanlab_mode: cloud
eval_every_options: 10000
eval_mini_seeds: 3
maze_n: 16
maze_braiding_stage0: 0.0
maze_loops_stage0: [0, 30]
maze_braiding_stage1: 0.8
maze_loops_stage1: [25, 50]
maze_fixed: generated
frontier_mask: true            # Explore 目标收窄为信念前沿格

gamma: 0.999
lr: 1.0e-4
batch_size: 64
target_sync_options: 1000
warmup_options: 2000
lambda_aux: 0.5
grad_clip: 10.0
eps_start: 0.10
eps_end: 0.02
eps_anneal_options: 20000
capacity: 100000
aux_head: true
use_traj: true
use_gru: false

shape_potential: true
shape_scale: 2000.0
cuda_graph: true

seed: 0
out_dir: algo/runs/armA_g0999_aux05_fixgen_frontier
checkpoint_every_options: 10000
smoke: false
