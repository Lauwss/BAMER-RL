# 方向连续性特征消融·归因臂（2026-11-22）：frontier 基线 + CH_ALIGN 对齐度场
# 对照 armA_g0999_aux05_frontier（同栈无 dir，100-seed held-out 40.0%、搜索
# 超时 58%）。dist/dilate 不开——单变量归因"方向通道本身"的贡献。
# 预期：单独可能不显著（rf 教训：单侧均 null、收益集中在互作），本臂仅作
# 归因不作判据；判据在主臂 armA_frontier_dist_dilate_dir（vs 58%）。
arm: A
stage0_options: 40000
stage1_options: 120000
stage1_eps_restart: 0.05
stage1_lr: null

env_randomize: true
env_max_steps: 1000
lidar_n_beams: 180
lidar_max_range: 2.0
swanlab: true
swanlab_project: BAMER-RL
swanlab_mode: cloud
eval_every_options: 10000
eval_mini_seeds: 3
maze_n: 16
maze_braiding_stage0: 0.0
maze_loops_stage0: [0, 30]
maze_braiding_stage1: 0.8
maze_loops_stage1: [25, 50]
frontier_mask: true            # 与基线同栈：frontier 引导保持开启

dir_channel: true              # ← 消融主变量：方向对齐度场（CH_ALIGN，单开）

gamma: 0.999
lr: 1.0e-4
batch_size: 64
target_sync_options: 1000
warmup_options: 2000
lambda_aux: 0.5
grad_clip: 10.0
eps_start: 0.10
eps_end: 0.02
eps_anneal_options: 20000
capacity: 100000
aux_head: true
use_traj: true
use_gru: false

shape_potential: true
shape_scale: 2000.0
cuda_graph: true

seed: 0
out_dir: algo/runs/armA_frontier_dir
checkpoint_every_options: 10000
smoke: false
