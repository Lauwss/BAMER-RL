# 感受野修复消融臂①（2026-11-22，GPT 外部批评核实）：仅距离通道
# 对照 armA_g0999_aux05_frontier（同栈基线，held-out 33.3%、63% 搜索超时、
# 探针 ρ(距离,优势)=−0.304 代理/ρ(信息量,优势)=+0.04）。主变量 dist_channel=true：
# Q 代价项 −τ/γ^τ 主特征（BFS 距离场）在目标格自身位置 RF-1 可读。
# 验收判据：探针 ρ(距离,优势) 强且稳定、近偏秩合理化、搜索超时率下降。
arm: A
stage0_options: 40000
stage1_options: 120000
stage1_eps_restart: 0.05
stage1_lr: null

env_randomize: true
env_max_steps: 1000
lidar_n_beams: 180
lidar_max_range: 2.0
swanlab: true
swanlab_project: BAMER-RL
swanlab_mode: cloud
eval_every_options: 10000
eval_mini_seeds: 3
maze_n: 16
maze_braiding_stage0: 0.0
maze_loops_stage0: [0, 30]
maze_braiding_stage1: 0.8
maze_loops_stage1: [25, 50]
frontier_mask: true            # 与基线同栈：frontier 引导保持开启

dist_channel: true             # ← 消融主变量①：末通道 = BFS 距离场
dilated_backbone: false

gamma: 0.999
lr: 1.0e-4
batch_size: 64
target_sync_options: 1000
warmup_options: 2000
lambda_aux: 0.5
grad_clip: 10.0
eps_start: 0.10
eps_end: 0.02
eps_anneal_options: 20000
capacity: 100000
aux_head: true
use_traj: true
use_gru: false

shape_potential: true
shape_scale: 2000.0
cuda_graph: true

seed: 0
out_dir: algo/runs/armA_frontier_dist
checkpoint_every_options: 10000
smoke: false
