# 臂 A：搜索预训练（主臂）→ 全任务微调（服务器正式训练配置）
# 阶段 0：−1/步 + 识别 +100 + 终点发现 +100（去送达 +300），terminated = 4 POI 定位
# 阶段 1：全任务微调（buffer 清空 + target 重置 + ε 重启 0.05）
arm: A
stage0_options: 40000       # 探索指标收敛即停，宁短勿长（§6.2 风险对策）
stage1_options: 120000
stage1_eps_restart: 0.05
stage1_lr: null             # 可选降 lr（如 5.0e-5）

env_randomize: true         # 防实例记忆 + 辅助头 GT 合法性前提
env_max_steps: 1000
lidar_n_beams: 180
lidar_max_range: 2.0
swanlab: false               # SwanLab 实验管理（云端；正式训练改 true，先 swanlab login）
swanlab_project: BAMER-RL
swanlab_mode: cloud
eval_every_options: 10000    # 训练中 mini held-out 评估（每 N options，3 seeds greedy）
eval_mini_seeds: 3
maze_n: 16
maze_braiding_stage0: 0.0    # stage0 低环：练死胡同回溯 + 系统覆盖
maze_loops_stage0: [0, 30]
maze_braiding_stage1: 0.8    # stage1 匹配 braided 赛图（37 环/215 格）
maze_loops_stage1: [25, 50]

gamma: 0.99
lr: 1.0e-4
batch_size: 64
target_sync_options: 1000
warmup_options: 2000
lambda_aux: 0.5             # 消融 {0, 0.1, 0.5, 1.0}
grad_clip: 10.0
eps_start: 0.10
eps_end: 0.02
eps_anneal_options: 20000
capacity: 100000
aux_head: true
use_traj: true              # 消融 vs 14 通道（false）
use_gru: false

seed: 0
out_dir: algo/runs/armA_search_pretrain
checkpoint_every_options: 10000
smoke: false
