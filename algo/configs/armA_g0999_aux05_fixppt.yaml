# 固定迷宫诊断 A/B（2026-11-21，GPT 评审"固定环境 A/B"采纳项）：
# 固定官方 PPT 赛图（Maze.default() = 2022 东北大会图 + 13 处虚线开口，215 可达格
# 37 环，装饰性封闭区），机器布点每集随机、终点沿用官方位置 (7,7)/(8,8)。
# 其余配方与 armA_g0999_aux05 完全一致。对照 = algo/runs/armA_g0999_aux05。
arm: A
stage0_options: 40000
stage1_options: 120000
stage1_eps_restart: 0.05
stage1_lr: null

env_randomize: true           # 固定迷宫下仅机器布点每集随机
env_max_steps: 1000
lidar_n_beams: 180
lidar_max_range: 2.0
swanlab: true
swanlab_project: BAMER-RL
swanlab_mode: cloud
eval_every_options: 10000
eval_mini_seeds: 3
maze_n: 16
maze_braiding_stage0: 0.0     # 固定官方图时不生效
maze_loops_stage0: [0, 30]
maze_braiding_stage1: 0.8     # 固定官方图时不生效
maze_loops_stage1: [25, 50]
maze_fixed: official          # 固定官方赛图

gamma: 0.999
lr: 1.0e-4
batch_size: 64
target_sync_options: 1000
warmup_options: 2000
lambda_aux: 0.5
grad_clip: 10.0
eps_start: 0.10
eps_end: 0.02
eps_anneal_options: 20000
capacity: 100000
aux_head: true
use_traj: true
use_gru: false

shape_potential: true
shape_scale: 2000.0
cuda_graph: true

seed: 0
out_dir: algo/runs/armA_g0999_aux05_fixppt
checkpoint_every_options: 10000
smoke: false
